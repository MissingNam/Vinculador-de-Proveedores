<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SunFinder | Propuesta de inicio</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#172536;background:#f7f9fa;--petrol:#164e63;--muted:#42566a;--border:#d8e2e8}
*{box-sizing:border-box}body{margin:0}a{color:var(--petrol)}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #0f766e;outline-offset:4px}
header{background:white;border-bottom:1px solid var(--border)}nav,main,footer{width:min(1120px,calc(100% - 40px));margin:auto}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}.brand{display:flex;align-items:center;gap:7px;text-decoration:none;font-size:1.25rem;font-weight:800;color:inherit}.brand img{width:40px}.login{font-weight:650;font-size:.94rem}
main{padding:32px 0 40px}.hero{display:grid;grid-template-columns:1fr 1fr;background:white;border:1px solid var(--border);border-radius:24px;overflow:hidden}.copy{padding:clamp(24px,5vw,56px)}h1{font-size:clamp(2rem,4.3vw,3.35rem);line-height:1.07;letter-spacing:-.045em;margin:0 0 14px}p{color:var(--muted);margin:0 0 16px}.example-note{margin:12px 0 0;font-size:.9rem}
label{display:block;font-weight:700;margin-bottom:6px}.controls{display:flex;gap:8px}input,button{font:inherit;border-radius:9px;min-height:44px}input{min-width:0;flex:1;border:1px solid #7a8da0;padding:9px 12px}button{border:1px solid transparent;cursor:pointer;font-weight:700;padding:9px 17px;background:var(--petrol);color:white}button:hover{background:#113d4e}
figure{margin:0;position:relative;min-height:280px;background:#ded9ca}.photo{width:100%;height:100%;display:block}figure .photo{position:absolute;inset:0}figcaption{position:absolute;right:14px;bottom:14px;background:white;padding:8px 13px;border-radius:10px;color:#24394b;font-size:.88rem}figcaption strong{display:block}
section{margin-top:30px}h2{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 12px}.categories,.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.category{padding:0;text-align:left;overflow:hidden;color:var(--petrol);background:white;border:1px solid var(--border);border-radius:14px}.category:hover,.category[aria-pressed=true]{background:#e6f4f2;color:#12463f;border-color:#0f766e}.category svg{aspect-ratio:2.3}.category span{display:block;padding:12px 15px}.result{background:white;padding:16px;border:1px solid var(--border);border-radius:12px}.result h3{margin:0 0 5px}.result p{margin:0 0 8px}.result button,#clear{background:white;color:var(--petrol);border-color:var(--border)}.heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.hint{font-size:.88rem}footer{padding:0 0 20px;font-size:.88rem;color:var(--muted)}
@media(max-width:720px){nav,main,footer{width:calc(100% - 28px)}main{padding-top:16px}.hero{grid-template-columns:1fr}.copy{padding:23px}figure{min-height:200px}.categories,.result-grid{grid-template-columns:1fr}.category{display:grid;grid-template-columns:112px 1fr;align-items:center}.category svg{height:68px;aspect-ratio:auto}.controls{flex-wrap:wrap}.controls input{flex-basis:100%}.controls button{width:100%}}
</style>
<body>
<header><nav aria-label="Principal"><a class="brand" href="./"><img src="logo.webp" alt="">SunFinder</a><a class="login" href="../../login">Iniciar sesión</a></nav></header>
<main>
<div class="hero">
<div class="copy">
<h1>Encuentra proveedores para tu empresa</h1>
<p>Busca productos o servicios y compara ofertas a tu ritmo.</p>
<form id="search" role="search">
<label for="query">¿Qué estás buscando?</label>
<div class="controls"><input id="query" name="q" type="search" placeholder="Ej. cajas de cartón"><button>Buscar</button></div>
</form>
<p class="example-note">Puedes explorar sin crear una cuenta.</p>
</div>
<figure><svg class="photo" role="img" aria-label="Dos personas revisan una muestra de cartón en una bodega" viewBox="503 92 627 458" preserveAspectRatio="xMidYMid slice"><image href="referencia.webp" width="1536" height="1024" /></svg><figcaption><strong>Ejemplo de oferta</strong>Cajas corrugadas · Mexicali</figcaption></figure>
</div>
<section aria-labelledby="categories-heading">
<h2 id="categories-heading">Explora por rubro</h2>
<div class="categories">
<button class="category" data-category="Empaque" aria-pressed="false"><svg class="photo" aria-hidden="true" viewBox="49 746 346 186" preserveAspectRatio="xMidYMid slice"><image href="referencia.webp" width="1536" height="1024" /></svg><span>Empaque →</span></button>
<button class="category" data-category="Mantenimiento" aria-pressed="false"><svg class="photo" aria-hidden="true" viewBox="418 746 329 186" preserveAspectRatio="xMidYMid slice"><image href="referencia.webp" width="1536" height="1024" /></svg><span>Mantenimiento →</span></button>
<button class="category" data-category="Transporte" aria-pressed="false"><svg class="photo" aria-hidden="true" viewBox="770 746 337 186" preserveAspectRatio="xMidYMid slice"><image href="referencia.webp" width="1536" height="1024" /></svg><span>Transporte →</span></button>
</div>
</section>
<section id="results" aria-labelledby="results-heading">
<div class="heading-row"><h2 id="results-heading" tabindex="-1">Ofertas de ejemplo</h2><button id="clear" type="button" hidden>Limpiar</button></div>
<p class="hint" id="status" role="status"></p>
<div class="result-grid" id="cards"></div>
</section>
</main>
<footer>Vista de prueba · Las ofertas son ficticias.</footer>
<template id="offer"><article class="result"><h3></h3><p class="meta"></p><details><summary>Ver oferta</summary><p class="description"></p></details></article></template>
<script>
const offers = [
  {title:'Cajas de cartón corrugado',category:'Empaque',type:'Producto',city:'Mexicali',description:'Cajas para pedidos y envíos. Medidas y volumen por confirmar.'},
  {title:'Mantenimiento preventivo industrial',category:'Mantenimiento',type:'Servicio',city:'Mexicali',description:'Revisión preventiva de maquinaria. Agenda y alcance por confirmar.'},
  {title:'Transporte de carga regional',category:'Transporte',type:'Servicio',city:'Tijuana',description:'Traslado de mercancía en Baja California. Capacidad y frecuencia por confirmar.'}
]
const query = document.querySelector('#query')
const clear = document.querySelector('#clear')
const categories = [...document.querySelectorAll('[data-category]')]
const template = document.querySelector('#offer')
let category = ''
const normalize = value => value.toLocaleLowerCase('es-MX').normalize('NFD').replace(/\p{Diacritic}/gu, '')
function render(move = false) {
  const words = normalize(query.value.trim()).split(/\s+/).filter(Boolean)
  const matches = offers.filter(offer => (!category || offer.category === category) &&
    words.every(word => normalize(Object.values(offer).join(' ')).includes(word)))
  const cards = document.querySelector('#cards')
  cards.replaceChildren(...matches.map(offer => {
    const card = template.content.cloneNode(true)
    card.querySelector('h3').textContent = offer.title
    card.querySelector('.meta').textContent = [offer.type, offer.category, offer.city].join(' · ')
    card.querySelector('.description').textContent = offer.description
    return card
  }))
  document.querySelector('#status').textContent = matches.length
    ? `${matches.length} ${matches.length === 1 ? 'oferta de ejemplo' : 'ofertas de ejemplo'}`
    : 'No encontramos ofertas de ejemplo. Prueba otro término o limpia la búsqueda.'
  clear.hidden = !category && !words.length
  categories.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.category === category)))
  if (move) document.querySelector('#results-heading').focus()
}
document.querySelector('#search').addEventListener('submit', event => { event.preventDefault(); category = ''; render(true) })
categories.forEach(button => button.addEventListener('click', () => { category = category === button.dataset.category ? '' : button.dataset.category; query.value = ''; render(true) }))
clear.addEventListener('click', () => { category = ''; query.value = ''; render(); query.focus() })
render()
</script>
</body>
</html>
